name: Create / Update E-Business Card

on:
  repository_dispatch:
    types: [create-card, update-card]

jobs:
  build-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main cards repo (for index.html / fiona.html updates if needed)
        uses: actions/checkout@v4
        with:
          repository: BeondRogue/beond-rogue-cards
          token: ${{ secrets.PAT }}
          path: main-repo

      - name: Checkout profile cards repo
        uses: actions/checkout@v4
        with:
          repository: BeondRogue/beond-rogue-ebusiness-card-profiles
          token: ${{ secrets.PAT }}
          path: cards-repo

      - name: Generate card HTML and update index
        env:
          NAME:     ${{ github.event.client_payload.name }}
          TITLE:    ${{ github.event.client_payload.title }}
          PHONE:    ${{ github.event.client_payload.phone }}
          EMAIL:    ${{ github.event.client_payload.email }}
          BUTTONS:  ${{ github.event.client_payload.buttons }}
          OLD_SLUG: ${{ github.event.client_payload.old_slug }}
        run: |
          python3 - <<'PYEOF'
          import os, re, json
          from datetime import datetime, timezone

          name     = os.environ.get('NAME', '')
          title    = os.environ.get('TITLE', '')
          phone    = os.environ.get('PHONE', '')
          email    = os.environ.get('EMAIL', '')
          buttons  = os.environ.get('BUTTONS', '').split(',')
          old_slug = os.environ.get('OLD_SLUG', '').strip()

          slug = re.sub(r'[^a-z0-9-]', '', name.lower().replace(' ', '-'))
          created_at = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          # Check if this is a primary card (John or Fiona)
          is_john  = (old_slug == 'john-nock' or slug == 'john-nock')
          is_fiona = (old_slug == 'fiona-slater' or slug == 'fiona-slater')

          # If slug changed for a profile card, delete the old HTML file
          if old_slug and old_slug != slug and not is_john and not is_fiona:
              old_path = f'cards-repo/{old_slug}.html'
              if os.path.exists(old_path):
                  os.remove(old_path)
                  print(f'Removed old card: {old_path}')

          def btn(key, href, icon, label, extra=''):
              if key in buttons:
                  cls = f'btn {extra}' if extra else 'btn'
                  return f'            <a href="{href}" target="_blank" class="{cls}"><i class="{icon}"></i> {label}</a>\n'
              return ''

          wa_num = re.sub(r'^0', '44', phone).replace(' ', '')
          phone44 = '+44' + phone.lstrip('0') if phone else ''

          # Generate vCard Data URI if requested
          vcard_btn = ''
          if 'vcard' in buttons:
              vcard_str = f"BEGIN:VCARD\nVERSION:3.0\nN:{name};;;;\nFN:{name}\nORG:BEOND ROGUE\nTITLE:{title}\n"
              if phone:
                  vcard_str += f"TEL;TYPE=CELL:{phone44}\n"
              if email:
                  vcard_str += f"EMAIL;TYPE=INTERNET:{email}\n"
              vcard_str += "URL:https://beondrogue.co.uk/\nEND:VCARD"
              import base64
              vcard_b64 = base64.b64encode(vcard_str.encode('utf-8')).decode('utf-8')
              vcard_href = f"data:text/vcard;charset=utf-8;base64,{vcard_b64}"
              vcard_btn = f'            <a href="{vcard_href}" download="{slug}.vcf" class="btn btn-cta"><i class="fa-solid fa-address-card"></i> Save Contact</a>\n'

          links = ''
          links += vcard_btn
          links += btn('exchange', 'https://docs.google.com/forms/d/14wVCaet2PdJ1KEoxqpgqqCimXy2QNX9dY4oJX4IcJ0I/viewform', 'fa-solid fa-address-book', 'Send Me Your Details', 'btn-cta')
          if phone:
              links += btn('call',     f'tel:{phone44}',                 'fa-solid fa-phone',     'Call Me')
          if email:
              links += btn('email',    f'mailto:{email}',                'fa-solid fa-envelope',  'Email Me')
          if phone:
              links += btn('whatsapp', f'https://wa.me/{wa_num}',        'fa-brands fa-whatsapp', 'WhatsApp')
          links += btn('website',   'https://beondrogue.co.uk/',          'fa-solid fa-globe',     'Official Website')
          links += btn('instagram', 'https://www.instagram.com/beond_rogue', 'fa-brands fa-instagram','Instagram')
          links += btn('tiktok',    'https://www.tiktok.com/@beond.rogue',   'fa-brands fa-tiktok',   'TikTok')
          links += btn('youtube',   'https://youtube.com/@beondrogue',       'fa-brands fa-youtube',  'YouTube')
          links += btn('facebook',  'https://www.facebook.com/share/19MkQ8F6VM/', 'fa-brands fa-facebook', 'Facebook')
          links += btn('linkedin',  'https://www.linkedin.com/in/beond-rogue-1ab925438', 'fa-brands fa-linkedin', 'LinkedIn')

          # Strip trailing newline from links block
          links = links.rstrip('\n')

          html = f"""<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{name} - BEOND ROGUE</title>
    <!-- OpenGraph / Social Share Previews -->
    <meta property="og:type" content="profile">
    <meta property="og:title" content="{name} - {title} | BEOND ROGUE">
    <meta property="og:description" content="Digital Business Card for {name} ({title}) at BEOND ROGUE - Cards & Collectables.">
    <meta property="og:image" content="https://beondrogue.github.io/beond-rogue-cards/assets/images/logo.jpg">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="{name} - {title} | BEOND ROGUE">
    <meta property="twitter:description" content="Digital Business Card for {name} ({title}) at BEOND ROGUE.">
    <meta property="twitter:image" content="https://beondrogue.github.io/beond-rogue-cards/assets/images/logo.jpg">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <img src="assets/images/banner.png" alt="Beond Rogue Banner" class="banner-img">
    <div class="card-container">
        <div class="profile-section">
            <img src="assets/images/logo.jpg" alt="Beond Rogue Logo" class="profile-logo">
            <h1 class="name">{name}</h1>
            <h2 class="title">{title}</h2>
        </div>
        <div class="links-section">
{links}
        </div>
    </div>
    <div class="footer">
        Not affiliated with Nintendo, Pokémon Company, Creatures, GAME FREAK, Wizards of the Coast, or Konami.
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>"""

          card_url = ""

          if is_john:
              # Update index.html in main-repo
              filepath = 'main-repo/index.html'
              card_url = 'https://beondrogue.github.io/beond-rogue-cards/'
              with open(filepath, 'w') as f:
                  f.write(html)
              print(f'Updated main John card: {filepath}')

          elif is_fiona:
              # Update fiona.html in main-repo
              filepath = 'main-repo/fiona.html'
              card_url = 'https://beondrogue.github.io/beond-rogue-cards/fiona.html'
              with open(filepath, 'w') as f:
                  f.write(html)
              print(f'Updated main Fiona card: {filepath}')

          else:
              # Profile card in cards-repo
              filepath = f'cards-repo/{slug}.html'
              card_url = f'https://beondrogue.github.io/beond-rogue-ebusiness-card-profiles/{slug}.html'
              with open(filepath, 'w') as f:
                  f.write(html)
              print(f'Written profile card: {filepath}')

          # Update cards-index.json in cards-repo
          index_path = 'cards-repo/cards-index.json'
          if os.path.exists(index_path):
              with open(index_path) as f:
                  index = json.load(f)
          else:
              index = []

          # Remove existing entry for old_slug or current slug
          target_slug = old_slug if old_slug else slug
          index = [c for c in index if c.get('slug') != target_slug and c.get('slug') != slug]

          index.append({
              'name': name,
              'title': title,
              'slug': slug if not (is_john or is_fiona) else target_slug,
              'phone': phone,
              'email': email,
              'buttons': os.environ.get('BUTTONS', ''),
              'created_at': created_at,
              'url': card_url
          })

          with open(index_path, 'w') as f:
              json.dump(index, f, indent=2)

          # Export vars for next steps
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'SLUG={slug}\n')
              f.write(f'CARDNAME={name}\n')
              f.write(f'IS_PRIMARY={"true" if (is_john or is_fiona) else "false"}\n')

          print(f'Index updated successfully with {len(index)} card(s)')
          PYEOF

      - name: Commit and push profile cards repo
        working-directory: cards-repo
        run: |
          git config user.name  "Beond Rogue Card Bot"
          git config user.email "cards@beondrogue.co.uk"
          git add -A
          git diff --cached --quiet || git commit -m "Update e-business card: ${CARDNAME}"
          git push

      - name: Commit and push main cards repo (if John or Fiona updated)
        if: env.IS_PRIMARY == 'true'
        working-directory: main-repo
        run: |
          git config user.name  "Beond Rogue Card Bot"
          git config user.email "cards@beondrogue.co.uk"
          git add index.html fiona.html
          git diff --cached --quiet || git commit -m "Update primary card HTML: ${CARDNAME}"
          git push
